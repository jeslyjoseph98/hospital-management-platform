server:
  port: 8080

spring:
  application:
    name: hms-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hms}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:hms}
    password: ${DB_PASSWORD:hms}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hms:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-seconds: 3600
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  admin-registration-code: ${ADMIN_REGISTRATION_CODE:HMS-ADMIN-2026}
  pharmacy-registration-code: ${PHARMACY_REGISTRATION_CODE:HMS-PHARMACY-2026}
